divisions:
  Portfolio & FAO:
    colour: '#3f7c8c'
    tagline: Financial Accounting Operations under the FAR regime
    background: Financial Accounting Operations, governed by the FAR accountability framework. A Copilot-based
      unit-pricing proof-of-concept already has executive visibility, and Ben Spencer's Unified Data Platform
      work is in flight — creating a future integration point across five operational processes.
  Finance:
    colour: '#c1743a'
    tagline: FBP, P&P, Revenue Payments, Tax & Finance BI
    background: Four Finance functions plus Finance BI. Copilot is used ad hoc; an Automation Team is
      already engaged on invoice extraction (duplication risk); and an active Zycus replacement business
      case could disrupt Zycus-adjacent tooling.
  Legal & CoSec:
    colour: '#6b6ca3'
    tagline: Company Secretariat & Legal — governance records
    background: Company Secretariat & Legal across ~4 companies and 5 committees (~20 entity/committee
      combinations). Diligent is the CoSec platform and a SharePoint migration is in flight. Critically,
      no board director attended the workshop despite the director experience being central to the top
      use cases.
  Superannuation:
    colour: '#4a8f6d'
    tagline: Master Trust operations & advice quality
    background: Master Trust operations and advice quality. 1,300 staff are outsourced to SS&C (Blue Door)
      with directors retaining liability but losing real-time data post-cutover; 25,000 advice calls a
      year (~150M words) with only ~5% reviewed. The Unified Data Platform underpins all four problem
      areas.
  Technology:
    colour: '#3b6ea5'
    tagline: Service management, cyber, TPRM & asset tech
    background: Six functional areas — Service Desk, Incident, Change, Cyber, TPRM/Assurance and Asset
      Management Tech. CMDB quality is a recurring root cause, Automation Anywhere bots run at ~80% failure,
      and a Python POC for assurance documents is already underway.
  People & Culture:
    colour: '#b0567f'
    tagline: TA, P&R, HRSS, Payroll, WR & OD
    background: Talent Acquisition, Performance & Reward, HR Shared Services, Payroll, Workplace Relations
      and OD/Learning. MyInsignia is outdated ($8M replacement flagged), the Enterprise Agreement restricts
      AI in employment decisions, and APRA/FAR succession accountability is a named external driver.
  Risk:
    colour: '#a8484a'
    tagline: Fraud, CRO reporting, conduct & regulatory
    background: Enterprise Risk — Fraud, CRO reporting, Conduct/NFR, Regulatory Horizon Scanning and a
      Risk Management knowledge base. Copilot access is pending for two leads, Atlas GRC is the central
      platform, and data spans three-plus legacy organisations.
  Strategy & Innovation:
    colour: '#8a6d3b'
    tagline: Planning, scorecards & competitive intelligence
    background: Group Strategy — planning, scorecards, competitive intelligence and trustee-facing reporting.
      Knowledge is fragmented across a 3x3 legacy company structure, an information-architecture project
      is in flight, and Copilot trials have been mixed.
  Wrap:
    colour: '#2f8f8f'
    tagline: Platform — sales, governance & operations
    background: 'The Wrap platform — Sales, Governance, Operations, Product and Custody. A ‘data assembly
      tax’ dominates: Operations runs 80–100 incidents a month on a legacy Delphi platform with only ~25%
      of work automated, and the UDP roadmap is the prerequisite for most initiatives.'
  Super to Retirement:
    colour: '#7a5aa8'
    tagline: Scaled digital advice & retirement transition
    background: Scaled digital advice and the super-to-retirement transition. 1,000 digital advice outcomes
      a year against a 100,000 target; SOAs take 6–8 weeks vs a 2-hour target; Insignia can reach only
      40% of members on consent. ASIC enforcement is escalating.
  Advice:
    colour: '#b98a3c'
    tagline: The financial advice value chain — Bridges & SFG
    background: The advice value chain across Bridges (five practices) and SFG. Paraplanning is the dominant
      bottleneck, data quality is the biggest blocker to any AI, a Dynamics 365 CRM change is expected
      by end of year, and FinTalkr is in use but not systematised.
  Asset Management:
    colour: '#6f8c3e'
    tagline: MLCAM — investments, PE/Alts & operations
    background: MLC Asset Management across a ~$100bn portfolio — investment teams, PE & Alts operations,
      investment operations, transition management and product. The single most consequential constraint
      is the absence of a trusted, private AI environment; CGI Glass Lewis IP must not leave the MLCAM
      boundary.
  Customer:
    colour: '#bd5f6b'
    tagline: Content, communications, data & delivery
    background: The Customer division — content & communications, data & reporting, and technology & institutional
      knowledge. Four active brands (MLC, Plum, ANZ, IOOF) multiply every communication, UDP harmonisation
      is still elementary, and multiple teams are already running AI experiments with no shared governance.
