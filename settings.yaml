header:
  company: Insignia Financial
  title: AI Strategy Value Realisation
  intro: Thirteen enterprise workshops · 25 Sprint 1 initiatives. Switch lenses above. In this view, click
    any division to fan out its cards — problem areas, AI-fit, the people engaged, gaps and next steps.
hub:
  name: AI Strategy
  tagline: Enterprise-wide AI strategy programme — March 2026
  url: https://ifl.atlassian.net/jira/software/c/projects/AIENG/boards/4552
